{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="card shadow mb-4">
            <div class="card-body">
                <h5>Añadir Producto</h5>
                <form action="/agregar_al_carrito" method="POST">
                    <select name="lote_id" class="form-select mb-2" required>
                        {% for lote in lotes %}
                        <option value="{{ lote[0] }}">
                            {{ lote[1] }} (Stock: {{ lote[3] }})
                        </option>
                        {% endfor %}
                    </select>
                    <input type="number" name="cantidad" class="form-control mb-2" placeholder="Cantidad" min="1" required>
                    <button type="submit" class="btn btn-primary w-100">Añadir a la Lista</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-8">
        <form action="/procesar_venta" method="POST">
            <div class="card shadow p-3 mb-3">
                <h5>Datos del Cliente y Comprobante</h5>
                <div class="row g-2">
                    <div class="col-md-6">
                        <input type="text" name="doc_identidad" class="form-control" placeholder="DNI o RUC" required>
                    </div>
                    <div class="col-md-6">
                        <select name="tipo_comprobante" class="form-select">
                            <option value="Boleta text-natural">Boleta (DNI/RUC 10)</option>
                            <option value="Factura text-juridica">Factura (RUC 20/10)</option>
                        </select>
                    </div>
                </div>
            </div>

            <table class="table bg-white shadow-sm">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cant.</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in session.get('carrito', []) %}
                    <tr>
                        <td>{{ item.nombre }}</td>
                        <td>{{ item.cantidad }}</td>
                        <td>${{ item.precio * item.cantidad }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            <button type="submit" class="btn btn-success btn-lg w-100">Confirmar Venta Total</button>
        </form>
    </div>
</div>
{% endblock %}
