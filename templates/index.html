<!DOCTYPE html>
<html lang="es">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">WisbenTech Pharma</a>
        <div class="navbar-nav">
            <a class="nav-link active" href="/">Inventario / Lotes</a>
            <a class="nav-link" href="/ventas">Nueva Venta</a>
        </div>
    </div>
</nav>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WisbenTech - Control de Medicamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Sistema de Inventario WisbenTech</a>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow">
            <div class="card-body">
            <h2>Registrar Medicamento</h2>
                <form action="/agregar" method="POST" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nombre del Medicamento</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Precio</label>
                        <input type="number" step="0.01" name="precio" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Guardar en Inventario</button>
                    </div>
                </form>
            </div>
        </div>
        <hr class="my-4">
            <h3>Inventario Actual</h3>
                <div class="table-responsive">
                    <table class="table table-hover table-bordered">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th>Acciones</th> </tr>
                        </thead>
                        <tbody>
                            {% for med in medicamentos %}
                            <tr>
                                <td>{{ med[0] }}</td>
                                <td>{{ med[1] }}</td>
                                <td>${{ med[2] }}</td>
                                <td>
                                    <a href="/eliminar/{{ med[0] }}" class="btn btn-danger btn-sm">Eliminar</a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>            
                    </table>
                </div>
    </div>
</body>
</html>
