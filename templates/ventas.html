<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Venta - WisbenTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">WisbenTech Pharma</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Inventario / Lotes</a>
                <a class="nav-link active" href="/ventas">Nueva Venta</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="card shadow">
            <div class="card-body">
                <h2 class="card-title mb-4">Procesar Venta</h2>
                <form action="/procesar_venta" method="POST" class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label">Seleccionar Producto y Lote (Stock Disponible)</label>
                        <select name="lote_id" class="form-select" required>
                            <option value="" selected disabled>Seleccione un medicamento...</option>
                            {% for lote in lotes %}
                            <option value="{{ lote[0] }}">
                                {{ lote[1] }} - Lote: {{ lote[2] }} (Quedan: {{ lote[3] }}) - Vence: {{ lote[4] }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Cantidad a Vender</label>
                        <input type="number" name="cantidad" class="form-control" min="1" required>
                    </div>
                    <div class="col-12 text-end">
                        <button type="submit" class="btn btn-success btn-lg">Confirmar Venta</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
