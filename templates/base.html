<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WisbenTech Pharma{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">WisbenTech Pharma</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Menú Principal</a>
                <a class="nav-link" href="/ventas">Nueva Venta</a>

                {% if session['rol'] == 'admin' %}
                    <a class="nav-link" href="/gestion_inventario">Inventario</a>
                    <a class="nav-link" href="/crear_usuario">Usuarios</a>
                {% endif %}

                <a class="nav-link text-danger" href="/logout">Salir ({{ session['username'] }})</a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
