{% extends "base.html" %}

{% block title %}Procesar Venta - WisbenTech{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <section class="card shadow border-0">
            <div class="card-header bg-primary text-white py-3">
                <h2 class="card-title h4 mb-0"><i class="bi bi-cart-check"></i> Registro de Venta Fiscal</h2>
            </div>
            <div class="card-body p-4">
                <form action="/procesar_venta" method="POST">
                    
                    <div class="row g-3 mb-4">
                        <div class="col-12"><h5 class="text-muted border-bottom pb-2">Información del Cliente</h5></div>
                        <div class="col-md-3">
                            <label class="form-label">Tipo de Documento</label>
                            <select name="tipo_doc_cliente" class="form-select" required>
                                <option value="DNI">DNI (Persona Natural)</option>
                                <option value="RUC">RUC (Persona Jurídica)</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Nro. Documento</label>
                            <input type="text" name="doc_identidad" class="form-control" placeholder="Ej: 7065..." required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nombre o Razón Social</label>
                            <input type="text" name="nombre_cliente" class="form-control" placeholder="Nombre completo" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-12"><h5 class="text-muted border-bottom pb-2">Detalle de la Operación</h5></div>
                        <div class="col-md-6">
                            <label class="form-label">Seleccionar Medicamento (Stock PEPS)</label>
                            <select name="lote_id" class="form-select" required>
                                <option value="" selected disabled>Seleccione un producto disponible...</option>
                                {% for lote in lotes %}
                                <option value="{{ lote[0] }}">
                                    {{ lote[1] }} | Lote: {{ lote[2] }} | Stock: {{ lote[3] }} | Vence: {{ lote[4] }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Cantidad</label>
                            <input type="number" name="cantidad" class="form-control" min="1" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Emitir Comprobante</label>
                            <select name="tipo_comprobante" class="form-select" required>
                                <option value="Boleta">Boleta de Venta</option>
                                <option value="Factura">Factura</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end pt-3">
                        <a href="/" class="btn btn-outline-secondary px-4">Cancelar</a>
                        <button type="submit" class="btn btn-success btn-lg px-5 shadow-sm">
                            Generar Comprobante
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </div>
</div>
{% endblock %}
